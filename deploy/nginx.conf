# Echo Graph nginx 站点配置(手动部署模板)
# 安装到 /etc/nginx/sites-available/echo-graph 后:
#   sudo ln -s /etc/nginx/sites-available/echo-graph /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# HTTPS 由 certbot 自动接管(certbot --nginx -d <域名>)

server {
    listen 80;
    server_name <你的域名>;

    root /opt/echo-graph/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 构建产物带 hash,可长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 前端使用 hash 路由,所有路径都回退到 index.html
    location / {
        try_files $uri /index.html;
    }
}
