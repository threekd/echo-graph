<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Echo Graph · 回声图谱</title>
  <link rel="stylesheet" href="/static/style.css?v=35" />
</head>
<body>
  <main>
    <div id="graph">
      <div id="stars">
        <div class="shooting"></div>
        <div class="shooting"></div>
      </div>
    </div>

    <div id="sidebar-zone-left"><span class="zone-icon">◀</span></div>
    <aside id="sidebar-left">
      <div class="brand">
        <h1>The Echo Graph</h1>
        <span class="badge">回声图谱</span>
      </div>
      <nav>
        <div id="view-status">视图:全图谱</div>
        <div class="field">
          <input id="q" type="text" placeholder="搜索作家 / 作品…" autocomplete="off" />
          <ul id="q-results"></ul>
        </div>
        <div class="path-box">
          <div class="path-fields">
            <div class="path-field">
              <input id="from" list="works" placeholder="起点作品" />
              <ul id="from-results" class="path-results"></ul>
            </div>
            <button id="btn-swap" title="交换起终点">⇅</button>
            <div class="path-field">
              <input id="to" list="works" placeholder="终点作品" />
              <ul id="to-results" class="path-results"></ul>
            </div>
          </div>
          <button id="btn-path">寻找路径</button>
        </div>
        <button id="btn-back-main" class="side-btn" style="display:none">返回全部图谱</button>
        <div id="expand-bar" style="display:none">
          <span class="expand-label">扩散范围</span>
          <input type="range" id="expand-range" min="1" max="8" step="1" value="1" />
          <span id="expand-value">1 级</span>
        </div>
        <div class="tool-row">
          <button id="btn-share" title="复制当前视图(含相机位置)的分享链接">分享链接</button>
          <button id="btn-export-png" title="导出当前视图为 PNG 图片">导出图片</button>
        </div>
      </nav>
      <div class="sidebar-bottom">
        <label class="opt" title="显示/隐藏作家节点">
          <input type="checkbox" id="show-authors" checked />
          <span>显示作家节点</span>
        </label>
        <label class="opt" title="隐藏未被提及、也未提及任何书籍的作品节点">
          <input type="checkbox" id="hide-islands" />
          <span>隐藏孤岛星</span>
        </label>
        <button id="btn-admin" class="side-btn">数据管理</button>
      </div>
    </aside>

    <div id="sidebar-zone-right"><span class="zone-icon">▶</span></div>
    <aside id="panel">
      <div id="panel-content">
        <div id="panel-empty">
          <p>点击任意节点查看详情;</p>
          <p>选中作品后可查看「涟漪」与「提及链」。</p>
        </div>
      </div>
    </aside>
  </main>

  <div id="toast"></div>

  <div id="guide">
    <div class="guide-card">
      <h3>回声图谱 · 快速上手</h3>
      <ul>
        <li><b>悬停</b>节点 → 暂停旋转,右侧显示详情</li>
        <li><b>点击</b>作品星 → 展开涟漪;点击作者星 → 该作者与全部作品</li>
        <li><b>右键拖拽</b>旋转 · <b>左键拖拽</b>平移 · <b>滚轮</b>缩放</li>
        <li>鼠标移到屏幕<b>左右边缘</b>呼出工具栏 / 详情栏</li>
        <li><b>Esc</b> 返回全图谱</li>
      </ul>
      <button id="guide-close">开始探索</button>
    </div>
  </div>

  <div id="admin-overlay" style="display:none">
    <div class="admin-shell">
      <div class="admin-head">
        <h2>数据管理</h2>
        <div class="admin-tabs">
          <button class="admin-tab active" data-kind="authors">作者 <span class="cnt"></span></button>
          <button class="admin-tab" data-kind="works">作品 <span class="cnt"></span></button>
          <button class="admin-tab" data-kind="edges">提及 <span class="cnt"></span></button>
        </div>
        <div class="admin-actions">
          <input id="admin-search" placeholder="搜索…" />
          <button id="admin-add">＋ 新增</button>
          <button id="admin-import">导入到 Neo4j</button>
          <button id="admin-export-json">导出 JSON</button>
          <button id="admin-export-csv">导出 CSV</button>
          <button id="admin-close">关闭</button>
        </div>
      </div>
      <div id="admin-status"></div>
      <div class="admin-body">
        <table id="admin-table"></table>
      </div>
    </div>
    <div id="admin-modal" style="display:none">
      <div class="admin-modal-card">
        <h3 id="admin-modal-title"></h3>
        <div id="admin-form"></div>
        <div id="admin-form-errors"></div>
        <div class="admin-modal-actions">
          <button id="admin-form-save">保存</button>
          <button id="admin-form-cancel">取消</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/vendor/three.min.js"></script>
  <script src="/static/vendor/CSS2DRenderer.js"></script>
  <script type="module" src="/static/main.js?v=34"></script>
</body>
</html>
