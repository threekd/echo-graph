name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (tests + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint
        run: uvx ruff check .
      - name: Test
        run: uv run python -m unittest discover -s tests -v
      - name: Export lockfile for audit
        run: uv export --frozen --no-hashes -o /tmp/requirements.txt
      - name: Dependency audit (non-blocking)
        continue-on-error: true
        run: uvx pip-audit -r /tmp/requirements.txt

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Dependency audit (non-blocking)
        continue-on-error: true
        run: pnpm audit

  version-consistency:
    name: Version consistency (pyproject == package.json)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          PY_VER=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          JS_VER=$(node -e "console.log(require('./frontend/package.json').version)")
          test "$PY_VER" = "$JS_VER"
