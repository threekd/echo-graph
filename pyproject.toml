[project]
name = "echo-graph"
version = "0.5.0"
description = "Litnebula — 回声图谱(世界文学影响图谱)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "argon2-cffi>=23.1.0",
    "fastapi>=0.141.1",
    "pydantic>=2.11",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.52.3",
]

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
