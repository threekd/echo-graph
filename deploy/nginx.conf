# Echo Graph nginx 站点配置(手动部署模板)
# 安装到 /etc/nginx/sites-available/echo-graph 后:
#   sudo ln -s /etc/nginx/sites-available/echo-graph /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# HTTPS 由 certbot 自动接管(certbot --nginx -d <域名>)
#
# 可选限流(贡献接口防洪;应用层另有每 IP 每小时 20 条的细粒度策略,见 DEPLOY.md):
# 在 nginx.conf 的 http 上下文添加一行(zone 只能定义在 http 层):
#   limit_req_zone $binary_remote_addr zone=echo_contribute:10m rate=10r/m;
# 然后启用下方注释掉的 location = /api/contribute/echo 限流块。

server {
    listen 80;
    server_name <你的域名>;

    root /opt/echo-graph/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 贡献提交限流(粗粒度防洪):启用前先在 http 上下文定义 zone(见文件头注释)
    # location = /api/contribute/echo {
    #     limit_req zone=echo_contribute burst=20 nodelay;
    #     limit_req_status 429;
    #     proxy_pass http://127.0.0.1:8000;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    # 构建产物带 hash,可长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 前端使用 hash 路由,所有路径都回退到 index.html
    location / {
        try_files $uri /index.html;
    }
}
