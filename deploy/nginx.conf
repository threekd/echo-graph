# Echo Graph nginx 站点配置(手动部署模板)
# 安装到 /etc/nginx/sites-available/echo-graph 后:
#   sudo ln -s /etc/nginx/sites-available/echo-graph /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# HTTPS 由 certbot 自动接管(certbot --nginx -d <域名>)
#
# 写接口限流在应用层完成(app/ratelimit.py),无需 nginx limit_req。
# 早期贡献收件箱的 /api/contribute/echo 限流块已随 contributions 移除。
#
# X-Forwarded-For 直接用 $remote_addr(单层代理):不要用
# $proxy_add_x_forwarded_for 追加客户端可控值,否则客户端可伪造最左 IP
# 绕过应用层限流(app/ratelimit.py 从右向左解析,但多跳场景仍应保证
# 各跳都只追加真实对端地址)。

server {
    listen 80;
    server_name <你的域名>;

    root /opt/echo-graph/frontend/dist;
    index index.html;

    # AI 书籍导入支持最大 20MB 电子书上传(与后端 MAX_BOOK_BYTES 一致);
    # nginx 默认 client_max_body_size 为 1MB,不放开会 413 拒绝正常 epub 上传
    client_max_body_size 20m;

    # 安全响应头(HTTPS 部署时 HSTS 生效;CSP 若引入新外部资源需同步调整)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 构建产物带 hash,可长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        # 子块定义 add_header 后不再继承 server 级头,需重复安全头
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    }

    # 前端使用 hash 路由,所有路径都回退到 index.html
    location / {
        try_files $uri /index.html;
    }
}
